    <!-- Encabezado y Barra de Navegación -->

    <!-- Cuerpo / Formulario de Tarjeta Club Cinépolis -->
    <div class="form-container">
        <h2>Club Cinépolis</h2>
        <form>
            <label for="tarjeta">Número de Tarjeta Club Cinépolis:</label>
            <input type="text" id="tarjeta" name="tarjeta" placeholder="Ingresa los 16 dígitos" required>

            <label for="nip">NIP o Contraseña:</label>
            <input type="password" id="nip" name="nip" placeholder="****" required>

            <button type="submit">Ingresar</button>
        </form>
    </div>
